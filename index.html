<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>One For All — القائمة | Menu | Irbid</title>
<meta name="description" content="قائمة ون فور اول في The NST، طريق الحصن، إربد. برجر سماش، دجاج مقلي، راب وبطاطا لودد — كلشي عنا بدينار وشوي. One For All smashed burgers in Irbid: menu and prices.">

<style>
:root{--red:#EF3D3D;--card:#D82827;--yellow:#FFCC49;--cream:#FFF6EE;--navy:#253D8D;--ink:#181617;--bone:#FBF9F4}
*{box-sizing:border-box}
html,body{margin:0;background:var(--red);color:var(--cream)}
body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;font:16px/1.45 "Inter Tight",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
:lang(ar){font-family:"IBM Plex Sans Arabic","Inter Tight",system-ui,sans-serif}
main{flex:1;width:100%;display:flex;flex-direction:column;padding-top:calc(10px + env(safe-area-inset-top))}
.stage{display:grid;aspect-ratio:1300/1845;width:100%;max-width:600px;margin:0 auto;overflow:hidden;background:var(--red);transition:opacity .16s ease}
.stage.swap{opacity:0}
.piece{grid-area:1/1;display:block;width:100%;height:auto;will-change:transform,opacity;
  clip-path:inset(var(--t) var(--r) var(--b) var(--l));transform-origin:var(--ox) var(--oy);
  opacity:0;transform:translate(var(--x),var(--y)) scale(var(--s));
  animation:land .9s var(--e,cubic-bezier(.16,.8,.18,1)) var(--d) both}
@keyframes land{to{opacity:1;transform:scale(var(--fs,1))}}
.stage.settled .piece{animation:none;opacity:1;transform:translate(var(--px,0px),var(--py,0px)) scale(var(--fs,1));transition:transform .18s ease-out}
.under{width:100%;max-width:600px;margin:0 auto;padding:24px 16px 0;display:flex;flex-direction:column;align-items:center;gap:8px;animation:fadeup .6s ease-out 1s both}
.under .pill{min-width:240px;text-align:center;text-decoration:none;font-weight:700;padding:12px 24px;border-radius:26px;background:var(--cream);color:var(--red)}
/* the text menu lives on /irbid/. This link is for screen readers and keyboards only: nothing but the card shows here */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.sr:focus-visible{position:static;width:auto;height:auto;clip-path:none;display:block;text-align:center;color:var(--cream);padding:12px}
.under a:focus-visible,.sr:focus-visible{outline:2px solid var(--cream);outline-offset:2px}
.floor{flex:1;min-height:160px;display:flex;align-items:flex-end;justify-content:center;padding:32px 0 calc(96px + env(safe-area-inset-bottom));
  background:linear-gradient(to bottom,var(--red),#C03435);animation:fadeup .6s ease-out 1.1s both}
.floor img{height:28px;width:auto;display:block}
.dock{position:fixed;left:0;right:0;margin:auto;bottom:calc(20px + env(safe-area-inset-bottom));z-index:2;direction:ltr;width:208px;height:52px;padding:4px;display:flex;gap:4px;border-radius:26px;
  background:rgba(24,22,23,.22);border:1px solid rgba(255,255,255,.30);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 0 4px rgba(250,250,250,.30),0 14px 34px rgba(0,0,0,.28);
  -webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);
  backdrop-filter:blur(2px) url('data:image/svg+xml;utf8,%3Csvg%20height%3D%2252%22%20width%3D%22208%22%20viewBox%3D%220%200%20208%2052%22%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%3E%3Cdefs%3E%3Cfilter%20id%3D%22displace%22%20color-interpolation-filters%3D%22sRGB%22%3E%3CfeImage%20x%3D%220%22%20y%3D%220%22%20height%3D%2252%22%20width%3D%22208%22%20href%3D%22data%3Aimage/svg%2Bxml%3Butf8%2C%253Csvg%2520height%253D%252252%2522%2520width%253D%2522208%2522%2520viewBox%253D%25220%25200%2520208%252052%2522%2520xmlns%253D%2522http%253A//www.w3.org/2000/svg%2522%253E%253Cstyle%253E.mix%257Bmix-blend-mode%253Ascreen%257D%253C/style%253E%253Cdefs%253E%253ClinearGradient%2520id%253D%2522Y%2522%2520x1%253D%25220%2522%2520x2%253D%25220%2522%2520y1%253D%25228%2525%2522%2520y2%253D%252292%2525%2522%253E%253Cstop%2520offset%253D%25220%2525%2522%2520stop-color%253D%2522%25230F0%2522/%253E%253Cstop%2520offset%253D%2522100%2525%2522%2520stop-color%253D%2522%2523000%2522/%253E%253C/linearGradient%253E%253ClinearGradient%2520id%253D%2522X%2522%2520x1%253D%25222%2525%2522%2520x2%253D%252298%2525%2522%2520y1%253D%25220%2522%2520y2%253D%25220%2522%253E%253Cstop%2520offset%253D%25220%2525%2522%2520stop-color%253D%2522%2523F00%2522/%253E%253Cstop%2520offset%253D%2522100%2525%2522%2520stop-color%253D%2522%2523000%2522/%253E%253C/linearGradient%253E%253C/defs%253E%253Crect%2520x%253D%25220%2522%2520y%253D%25220%2522%2520height%253D%252252%2522%2520width%253D%2522208%2522%2520fill%253D%2522%2523808080%2522/%253E%253Cg%2520filter%253D%2522blur%25282px%2529%2522%253E%253Crect%2520x%253D%25220%2522%2520y%253D%25220%2522%2520height%253D%252252%2522%2520width%253D%2522208%2522%2520fill%253D%2522%2523000080%2522/%253E%253Crect%2520x%253D%25220%2522%2520y%253D%25220%2522%2520height%253D%252252%2522%2520width%253D%2522208%2522%2520fill%253D%2522url%2528%2523Y%2529%2522%2520class%253D%2522mix%2522/%253E%253Crect%2520x%253D%25220%2522%2520y%253D%25220%2522%2520height%253D%252252%2522%2520width%253D%2522208%2522%2520fill%253D%2522url%2528%2523X%2529%2522%2520class%253D%2522mix%2522/%253E%253Crect%2520x%253D%25228%2522%2520y%253D%25228%2522%2520height%253D%252236%2522%2520width%253D%2522192%2522%2520fill%253D%2522%2523808080%2522%2520rx%253D%252226%2522%2520ry%253D%252226%2522%2520filter%253D%2522blur%25288px%2529%2522/%253E%253C/g%253E%253C/svg%253E%22%20result%3D%22displacementMap%22/%3E%3CfeDisplacementMap%20transform-origin%3D%22center%22%20in%3D%22SourceGraphic%22%20in2%3D%22displacementMap%22%20scale%3D%2264%22%20xChannelSelector%3D%22R%22%20yChannelSelector%3D%22G%22/%3E%3CfeColorMatrix%20type%3D%22matrix%22%20values%3D%221%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%201%200%22%20result%3D%22displacedR%22/%3E%3CfeDisplacementMap%20in%3D%22SourceGraphic%22%20in2%3D%22displacementMap%22%20scale%3D%2262%22%20xChannelSelector%3D%22R%22%20yChannelSelector%3D%22G%22/%3E%3CfeColorMatrix%20type%3D%22matrix%22%20values%3D%220%200%200%200%200%200%201%200%200%200%200%200%200%200%200%200%200%200%201%200%22%20result%3D%22displacedG%22/%3E%3CfeDisplacementMap%20in%3D%22SourceGraphic%22%20in2%3D%22displacementMap%22%20scale%3D%2260%22%20xChannelSelector%3D%22R%22%20yChannelSelector%3D%22G%22/%3E%3CfeColorMatrix%20type%3D%22matrix%22%20values%3D%220%200%200%200%200%200%200%200%200%200%200%200%201%200%200%200%200%200%201%200%22%20result%3D%22displacedB%22/%3E%3CfeBlend%20in%3D%22displacedR%22%20in2%3D%22displacedG%22%20mode%3D%22screen%22/%3E%3CfeBlend%20in2%3D%22displacedB%22%20mode%3D%22screen%22/%3E%3C/filter%3E%3C/defs%3E%3C/svg%3E#displace') blur(6px) saturate(1.4);
  animation:rise .55s cubic-bezier(.16,.8,.18,1) 1.3s both}
.dock::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,rgba(255,255,255,.20),rgba(255,255,255,0) 48%);pointer-events:none}
.thumb{position:absolute;top:4px;left:4px;width:calc(50% - 6px);height:calc(100% - 8px);border-radius:22px;background:var(--navy);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.dock[data-lang=ar] .thumb{transform:translateX(calc(100% + 4px))}
.dock button{position:relative;z-index:1;flex:1;appearance:none;border:0;border-radius:22px;background:transparent;color:var(--cream);font:600 15px/1 "Inter Tight",system-ui,sans-serif;cursor:pointer;padding:0}
.dock button[lang=ar]{font:500 16px/1 "IBM Plex Sans Arabic","Inter Tight",sans-serif}
.dock button:focus-visible{outline:2px solid var(--cream);outline-offset:2px}
.dock svg{position:absolute;inset:-1px;width:calc(100% + 2px);height:calc(100% + 2px);pointer-events:none;fill:none;stroke:var(--bone);stroke-width:2}
.dock rect{stroke-dasharray:1;animation:flow .6s ease-out 1.6s both,fade .4s ease-out 2.3s both}
noscript img{display:block;width:100%;max-width:600px;height:auto;margin:0 auto}
[hidden]{display:none!important}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes flow{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fade{to{stroke-opacity:0}}
@media (prefers-reduced-motion:reduce){
  .piece,.under,.floor,.dock,.dock rect{animation:none}.piece{opacity:1;transform:scale(var(--fs,1))}.dock rect{stroke-opacity:0}.thumb,.stage,.stage.settled .piece{transition:none}
}
</style>
<noscript><style>.stage{display:none}</style></noscript>
</head>
<body>

<main>
  <div class="stage" id="stage" role="img" aria-label="قائمة ون فور اول"></div>
  <noscript><img src="menu-ar.png" width="1300" height="1845" alt="قائمة ون فور اول"></noscript>

<a id="more" class="sr" href="irbid/"></a>
  <div class="under" id="under" hidden>
    <a id="card-link" class="pill" href="#"></a>
  </div>

  <div class="floor"><img src="lockup.svg" alt="The X Floor"></div>
</main>
<nav class="dock" data-lang="ar" aria-label="Language">
  <span class="thumb" aria-hidden="true"></span>
  <button id="btn-en" lang="en" aria-pressed="false">English</button>
  <button id="btn-ar" lang="ar" aria-pressed="true">عربي</button>
  <svg aria-hidden="true"><rect x="0" y="0" width="100%" height="100%" rx="26" pathLength="1"/></svg>
</nav>

<script>
const PIECES = {"en": [{"n": "head", "t": 0, "b": 91.92, "l": 0, "r": 0, "x": 0, "y": -28, "s": 1, "depth": 0.5, "d": 0}, {"n": "main", "t": 8.08, "b": 45.15, "l": 0, "r": 0, "x": 0, "y": 48, "s": 0.985, "depth": 1, "d": 120}, {"n": "cream", "t": 54.85, "b": 30.730000000000004, "l": 0, "r": 0, "x": 0, "y": 48, "s": 1, "depth": 1.4, "d": 240}, {"n": "left", "t": 69.27, "b": 12.409999999999997, "l": 0, "r": 27.040000000000006, "x": -40, "y": 0, "s": 1, "depth": 1, "d": 360}, {"n": "right", "t": 69.27, "b": 12.409999999999997, "l": 72.96, "r": 0, "x": 40, "y": 0, "s": 1, "depth": 1.25, "d": 450}, {"n": "stamp", "t": 88.35, "b": 2.44, "l": 42, "r": 42, "fs": 1.25, "x": 0, "y": 0, "s": 0.55, "depth": 1.9, "d": 560, "e": "cubic-bezier(.34,1.45,.64,1)"}], "ar": [{"n": "head", "t": 0, "b": 91.92, "l": 0, "r": 0, "x": 0, "y": -28, "s": 1, "depth": 0.5, "d": 0}, {"n": "main", "t": 8.08, "b": 45.15, "l": 0, "r": 0, "x": 0, "y": 48, "s": 0.985, "depth": 1, "d": 120}, {"n": "cream", "t": 54.85, "b": 30.730000000000004, "l": 0, "r": 0, "x": 0, "y": 48, "s": 1, "depth": 1.4, "d": 240}, {"n": "left", "t": 69.27, "b": 12.409999999999997, "l": 0, "r": 27.040000000000006, "x": -40, "y": 0, "s": 1, "depth": 1, "d": 360}, {"n": "right", "t": 69.27, "b": 12.409999999999997, "l": 72.96, "r": 0, "x": 40, "y": 0, "s": 1, "depth": 1.25, "d": 450}, {"n": "stamp", "t": 88.35, "b": 2.44, "l": 42, "r": 42, "fs": 1.25, "x": 0, "y": 0, "s": 0.55, "depth": 1.9, "d": 560, "e": "cubic-bezier(.34,1.45,.64,1)"}]};
const LABEL = {ar: 'قائمة ون فور اول', en: 'One For All menu'};
const MORE = {ar: 'المنيو كنص مقروء، مع الموقع والاتجاهات', en: 'The menu as readable text, with location and directions'};
const CARD = {ar: 'بطاقتي — اجمع أختامك', en: 'My card — collect your stamps'};
/* The loyalty card's address. Empty until the card is live: the "My card" button stays hidden. */
const LOYALTY_URL = '';
const KEY = 'ofa-lang';
const stage = document.getElementById('stage');
const dock = document.querySelector('.dock');
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
let settled = false;

// The card assembles from its own panels: six clipped copies of the same artwork land in reading order.
const build = async (lang, animate) => {
  stage.replaceChildren();
  const art = new Image();
  art.src = 'menu-' + lang + '.svg';
  await art.decode().catch(() => {});
  let pending = 0;
  for (const p of PIECES[lang]) {
    const img = new Image(1300, 1845);
    img.src = 'menu-' + lang + '.svg';
    img.alt = '';
    img.className = 'piece';
    img.dataset.depth = p.depth;
    const st = img.style;
    st.setProperty('--t', p.t + '%'); st.setProperty('--r', p.r + '%'); st.setProperty('--b', p.b + '%'); st.setProperty('--l', p.l + '%');
    st.setProperty('--ox', (p.l + (100 - p.l - p.r) / 2) + '%'); st.setProperty('--oy', (p.t + (100 - p.t - p.b) / 2) + '%');
    st.setProperty('--x', p.x + 'px'); st.setProperty('--y', p.y + 'px'); st.setProperty('--s', p.s); st.setProperty('--d', p.d + 'ms');
    if (p.e) st.setProperty('--e', p.e);
    if (p.fs) st.setProperty('--fs', p.fs);
    if (animate) { pending++; img.addEventListener('animationend', () => { if (--pending === 0) settle(); }, { once: true }); }
    stage.appendChild(img);
  }
  if (!animate) settle();
};
const settle = () => { stage.classList.add('settled'); settled = true; };

// Depth: the panels shift with the phone's tilt, or the pointer on a desktop.
const parallax = (nx, ny) => {
  if (!settled || still) return;
  for (const el of stage.children) {
    const d = +el.dataset.depth;
    el.style.setProperty('--px', (nx * d * 6).toFixed(1) + 'px');
    el.style.setProperty('--py', (ny * d * 6).toFixed(1) + 'px');
  }
};
const clamp = v => Math.max(-1, Math.min(1, v));
const tilt = e => { if (e.gamma != null) parallax(clamp(e.gamma / 22), clamp((e.beta - 45) / 22)); };
const armTilt = () => {
  if (typeof DeviceOrientationEvent === 'undefined') return;
  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(s => { if (s === 'granted') addEventListener('deviceorientation', tilt); }).catch(() => {});
  } else addEventListener('deviceorientation', tilt);
};
if (matchMedia('(pointer:fine)').matches) addEventListener('pointermove', e => parallax((e.clientX / innerWidth - .5) * 2, (e.clientY / innerHeight - .5) * 2));
if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission !== 'function') armTilt();

/* Language: ?lang= wins, then a remembered choice, then the phone's language, then Arabic.
   Spec: nfc-piece/README.md "Menu language". */
const show = (l, first, remember) => {
  l = (l === 'en') ? 'en' : 'ar';
  for (const k of ['ar', 'en']) document.getElementById('btn-' + k).setAttribute('aria-pressed', k === l);
  const more = document.getElementById('more'), card = document.getElementById('card-link');
  more.textContent = MORE[l]; more.href = 'irbid/?lang=' + l; more.lang = l;
  card.textContent = CARD[l]; card.lang = l; if (LOYALTY_URL) { card.href = LOYALTY_URL + '?lang=' + l; document.getElementById('under').hidden = false; }
  dock.dataset.lang = l;
  stage.setAttribute('aria-label', LABEL[l]);
  document.documentElement.lang = l;
  document.documentElement.dir = (l === 'ar') ? 'rtl' : 'ltr';
  if (remember) { try { localStorage.setItem(KEY, l); } catch (e) {} }
  if (first) { build(l, !still); return; }
  stage.classList.add('swap');
  setTimeout(() => build(l, false).then(() => stage.classList.remove('swap')), 170);
};
for (const k of ['ar', 'en']) document.getElementById('btn-' + k).onclick = () => { armTilt(); if (dock.dataset.lang !== k) show(k, false, true); };
const param = new URLSearchParams(location.search).get('lang');
let saved = null; try { saved = localStorage.getItem(KEY); } catch (e) {}
show(param || saved || (navigator.language.indexOf('ar') === 0 ? 'ar' : 'en'), true, false);
</script>

</body>
</html>
