<style>
:root{--red:#EF3D3D;--card:#D82827;--yellow:#FFCC49;--cream:#FFF6EE;--navy:#253D8D;--ink:#181617;--bone:#FBF9F4}
*{box-sizing:border-box}
html,body{margin:0;background:var(--red);color:var(--cream)}
body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;font:500 16px/1.45 "Baloo Bhaijaan 2",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
:lang(ar){font-family:"IBM Plex Sans Arabic","Baloo Bhaijaan 2",system-ui,sans-serif}
main{flex:1;width:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
/* their shopfront awning over the card; the card itself is never edited */
.awning{position:relative;width:100%;height:40px;flex:none;margin-bottom:20px;background:repeating-linear-gradient(90deg,var(--cream) 0 30px,var(--card) 30px 60px);box-shadow:0 8px 14px rgba(0,0,0,.18);transform-origin:top;animation:awn .55s cubic-bezier(.2,.9,.25,1.15) both}
.awning::after{content:"";position:absolute;left:0;right:0;top:100%;height:15px;background:radial-gradient(circle at 15px 0,var(--cream) 14.5px,transparent 15px) 0 0/60px 15px repeat-x,radial-gradient(circle at 45px 0,var(--card) 14.5px,transparent 15px) 0 0/60px 15px repeat-x;filter:drop-shadow(0 5px 5px rgba(0,0,0,.2))}
.stage{display:grid;aspect-ratio:1300/1845;width:100%;max-width:600px;margin:0 auto;overflow:hidden;background:var(--red);transition:opacity .16s ease}
.stage.swap{opacity:0}
.piece{grid-area:1/1;display:block;width:100%;height:auto;will-change:transform,opacity;
  clip-path:inset(var(--t) var(--r) var(--b) var(--l));transform-origin:var(--ox) var(--oy);
  opacity:0;transform:translate(var(--x),var(--y)) scale(var(--s));
  animation:land .9s var(--e,cubic-bezier(.16,.8,.18,1)) var(--d) both}
@keyframes land{to{opacity:1;transform:scale(var(--fs,1))}}
.stage.settled .piece{animation:none;opacity:1;transform:translate(var(--px,0px),var(--py,0px)) scale(var(--fs,1));transition:transform .18s ease-out}
.under{width:100%;max-width:600px;margin:0 auto;padding:12px 16px 24px;display:flex;flex-direction:column;align-items:center;gap:8px;animation:fadeup .6s ease-out 1s both}
.under .pill{min-width:240px;text-align:center;text-decoration:none;font-weight:700;padding:12px 24px;border-radius:26px;background:var(--cream);color:var(--red)}
/* the text menu lives on /irbid/. This link is for screen readers and keyboards only: nothing but the card shows here */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.sr:focus-visible{position:static;width:auto;height:auto;clip-path:none;display:block;text-align:center;color:var(--cream);padding:12px}
.under a:focus-visible,.sr:focus-visible{outline:2px solid var(--cream);outline-offset:2px}
.floor{flex:1;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 0 calc(20px + env(safe-area-inset-bottom));
  background:linear-gradient(rgba(24,22,23,.13) 2px,transparent 2px) 0 0/46px 46px,linear-gradient(90deg,rgba(24,22,23,.13) 2px,transparent 2px) 0 0/46px 46px,linear-gradient(to bottom,var(--red),#C03435);animation:fadeup .6s ease-out 1.1s both}
.floor img{height:28px;width:auto;display:block}
.floor a{display:block;padding:8px;margin:-8px}   /* a 44 px target around the 28 px mark; the negative margin keeps the mark where it was */
.floor a:focus-visible{outline:2px solid var(--cream);outline-offset:2px}
/* A way back to the main page - shown only to visitors who came from it (?from=site). A tap on the NFC
   piece at the window still opens the card and nothing else, on the founder's call (2026-09-19). */
.back{position:fixed;top:calc(8px + env(safe-area-inset-top));inset-inline-start:12px;z-index:3;display:inline-flex;align-items:center;
  min-height:44px;padding:0 18px;border-radius:22px;background:var(--cream);color:var(--card);text-decoration:none;
  font:700 15px/1 "Baloo Bhaijaan 2",system-ui,sans-serif;box-shadow:0 6px 16px rgba(0,0,0,.22)}
.back:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
.menu-head{direction:ltr;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:6px;max-width:600px;width:100%;margin:0 auto 6px;padding:0 12px}
.menu-head .menu-brand{grid-column:1;display:flex;align-items:center;gap:6px;justify-self:start}.menu-head h1{grid-column:2;margin:0;font-size:26px;line-height:1;color:var(--yellow)}.menu-logo{display:flex;align-items:center;justify-content:center;min-width:44px;min-height:44px}.menu-head img{display:block;width:clamp(36px,10vw,52px);height:auto;object-fit:contain}
.dock{grid-column:3;justify-self:end;direction:ltr;display:flex;align-items:center}
.dock button{appearance:none;border:0;border-radius:0;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20120%2064%22%3E%3Cpath%20d%3D%22M17%206%20C38%209%2075%201%20100%206%20C116%208%20115%2016%20111%2028%20C108%2038%20119%2050%20106%2057%20C88%2063%2072%2055%2050%2059%20C31%2063%207%2060%208%2045%20C10%2034%201%2018%208%2010%20Q11%206%2017%206Z%22%20fill%3D%22none%22%20stroke%3D%22%23FFF6EE%22%20stroke-width%3D%222%22%2F%3E%3Cpath%20d%3D%22M19%2010%20C40%2012%2077%205%2099%2010%20C111%2012%20110%2018%20107%2028%20C104%2039%20114%2048%20104%2053%20C87%2058%2072%2052%2050%2055%20C33%2059%2012%2056%2012%2045%20C14%2033%206%2019%2012%2013%20Q15%2010%2019%2010Z%22%20fill%3D%22none%22%20stroke%3D%22%23FFF6EE%22%20stroke-width%3D%22.7%22%2F%3E%3C%2Fsvg%3E") center/100% 100% no-repeat;color:var(--cream);font:700 15px/1 "Baloo Bhaijaan 2",system-ui,sans-serif;padding:12px 14px;cursor:pointer;min-height:44px;min-width:80px;white-space:nowrap}
.dock button[hidden]{display:none}
.dock button:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.stage-wrap{position:relative;width:100%;max-width:600px;margin:0 auto;overflow:hidden}.stage{margin-top:-11.467%}
.instagram-hit{display:flex;align-items:center;min-height:44px;font-size:clamp(9px,2.8vw,12px);color:inherit;text-decoration:none;white-space:nowrap}
.instagram-hit:focus-visible{outline:3px solid var(--cream);outline-offset:-3px}
noscript img{display:block;width:100%;max-width:600px;height:auto;margin:0 auto}
[hidden]{display:none!important}
@keyframes awn{from{transform:scaleY(0);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes flow{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fade{to{stroke-opacity:0}}
/* A phone turned sideways: the switch moves up over the awning, so it never sits on the card's lines. */

/* A desktop: the whole card fits above the switch at first view. */
@media (min-aspect-ratio:1/1) and (min-height:561px){.stage-wrap{max-width:min(600px,calc((100svh - 130px - 96px) * 1300 / 1845))}.stage{max-width:100%}}
@media (prefers-reduced-motion:reduce){
  .piece,.under,.floor,.dock,.dock rect,.awning{animation:none}.piece{opacity:1;transform:scale(var(--fs,1))}.dock rect{stroke-opacity:0}.thumb,.stage,.stage.settled .piece{transition:none}
}

  <a id="back" class="back" href="https://oneforalljo.com/irbid/" hidden></a>

    <div class="menu-brand"><a class="menu-logo" href="https://oneforalljo.com/irbid/"><img src="ofa-badge.webp" width="480" height="568" alt="One For All"></a><a class="instagram-hit" href="https://www.instagram.com/oneforall.jo" dir="ltr">@oneforall.jo</a></div>

<script>
const PIECES = {"en": [{"n": "head", "t": 0, "b": 91.92, "l": 0, "r": 0, "x": 0, "y": -28, "s": 1, "depth": 0.5, "d": 0}, {"n": "main", "t": 8.08, "b": 45.15, "l": 0, "r": 0, "x": 0, "y": 48, "s": 0.985, "depth": 1, "d": 120}, {"n": "cream", "t": 54.85, "b": 30.730000000000004, "l": 0, "r": 0, "x": 0, "y": 48, "s": 1, "depth": 1.4, "d": 240}, {"n": "left", "t": 69.27, "b": 12.409999999999997, "l": 0, "r": 27.040000000000006, "x": -40, "y": 0, "s": 1, "depth": 1, "d": 360}, {"n": "right", "t": 69.27, "b": 12.409999999999997, "l": 72.96, "r": 0, "x": 40, "y": 0, "s": 1, "depth": 1.25, "d": 450}, {"n": "stamp", "t": 88.35, "b": 2.44, "l": 42, "r": 42, "fs": 1.25, "x": 0, "y": 0, "s": 0.55, "depth": 1.9, "d": 560, "e": "cubic-bezier(.34,1.45,.64,1)"}], "ar": [{"n": "head", "t": 0, "b": 91.92, "l": 0, "r": 0, "x": 0, "y": -28, "s": 1, "depth": 0.5, "d": 0}, {"n": "main", "t": 8.08, "b": 45.15, "l": 0, "r": 0, "x": 0, "y": 48, "s": 0.985, "depth": 1, "d": 120}, {"n": "cream", "t": 54.85, "b": 30.730000000000004, "l": 0, "r": 0, "x": 0, "y": 48, "s": 1, "depth": 1.4, "d": 240}, {"n": "left", "t": 69.27, "b": 12.409999999999997, "l": 0, "r": 27.040000000000006, "x": -40, "y": 0, "s": 1, "depth": 1, "d": 360}, {"n": "right", "t": 69.27, "b": 12.409999999999997, "l": 72.96, "r": 0, "x": 40, "y": 0, "s": 1, "depth": 1.25, "d": 450}, {"n": "stamp", "t": 88.35, "b": 2.44, "l": 42, "r": 42, "fs": 1.25, "x": 0, "y": 0, "s": 0.55, "depth": 1.9, "d": 560, "e": "cubic-bezier(.34,1.45,.64,1)"}]};
const LABEL = {ar: 'قائمة ون فور اول', en: 'One For All menu'};
const MORE = {ar: 'المنيو كنص مقروء، مع الموقع والاتجاهات', en: 'The menu as readable text, with location and directions'};
const CARD = {ar: 'بطاقتي — اجمع أختامك', en: 'My card — collect your stamps'};
const BACK = {ar: '→ ون فور اول', en: '← One For All'};
/* Absolute: the tag opens this page on github.io, and the main page lives on the shop's domain. */
const SITE = 'https://oneforalljo.com/';
const FROM_SITE = new URLSearchParams(location.search).get('from') === 'site';
/* The loyalty card's address. Empty until the card is live: the "My card" button stays hidden. */
const LOYALTY_URL = 'https://card.oneforalljo.com/';
const KEY = 'ofa-lang';
const stage = document.getElementById('stage');
const dock = document.querySelector('.dock');
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
let settled = false;

// The card assembles from its own panels: six clipped copies of the same artwork land in reading order.
const build = async (lang, animate) => {
  stage.replaceChildren();
  const art = new Image();
  art.src = 'menu-' + lang + '.svg';
  await art.decode().catch(() => {});
  let pending = 0;
  for (const p of PIECES[lang].filter(p => p.n !== 'head')) {
    const img = new Image(1300, 1845);
    img.src = 'menu-' + lang + '.svg';
    img.alt = '';
    img.className = 'piece';
    img.draggable = false;   /* a finger drawn across the card moves its panels; it must not pick up the picture */
    img.dataset.depth = p.depth;
    const st = img.style;
    st.setProperty('--t', p.t + '%'); st.setProperty('--r', p.r + '%'); st.setProperty('--b', p.b + '%'); st.setProperty('--l', p.l + '%');
    st.setProperty('--ox', (p.l + (100 - p.l - p.r) / 2) + '%'); st.setProperty('--oy', (p.t + (100 - p.t - p.b) / 2) + '%');
    st.setProperty('--x', p.x + 'px'); st.setProperty('--y', p.y + 'px'); st.setProperty('--s', p.s); st.setProperty('--d', p.d + 'ms');
    if (p.e) st.setProperty('--e', p.e);
    if (p.fs) st.setProperty('--fs', p.fs);
    if (animate) { pending++; img.addEventListener('animationend', () => { if (--pending === 0) settle(); }, { once: true }); }
    stage.appendChild(img);
  }
  if (!animate) settle();
};
const settle = () => { stage.classList.add('settled'); settled = true; };

// Depth: the panels shift with the phone's tilt, or the pointer on a desktop.
const parallax = (nx, ny) => {
  if (!settled || still) return;
  for (const el of stage.children) {
    const d = +el.dataset.depth;
    el.style.setProperty('--px', (nx * d * 6).toFixed(1) + 'px');
    el.style.setProperty('--py', (ny * d * 6).toFixed(1) + 'px');
  }
};
const clamp = v => Math.max(-1, Math.min(1, v));
const tilt = e => { if (e.gamma != null) parallax(clamp(e.gamma / 22), clamp((e.beta - 45) / 22)); };
const armTilt = () => {
  if (still) return;   /* asked for less motion: do not even ask iOS for the sensor */
  if (typeof DeviceOrientationEvent === 'undefined') return;
  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(s => { if (s === 'granted') addEventListener('deviceorientation', tilt); }).catch(() => {});
  } else addEventListener('deviceorientation', tilt);
};
if (matchMedia('(pointer:fine)').matches) addEventListener('pointermove', e => parallax((e.clientX / innerWidth - .5) * 2, (e.clientY / innerHeight - .5) * 2));
if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission !== 'function') armTilt();

/* A phone has no pointer to follow, and iOS gives tilt only behind a permission prompt, so there the card
   went still the moment it landed. On a touch screen the panels now drift in depth on their own, follow a
   finger drawn across the card, and give way to the phone's tilt wherever the browser supplies it.
   Paused while the card is off screen or the tab is hidden; nothing at all under reduced motion. */
if (!matchMedia('(pointer:fine)').matches && !still) {
  let raf = 0, inView = true, lead = -1e9, since = 0, fx = 0, fy = 0;
  const drift = t => {
    raf = requestAnimationFrame(drift);
    if (!settled || t - lead < 2000) { since = 0; return; }   // landing, or a finger or the tilt is steering
    if (!since) since = t;
    const k = Math.min(1, (t - since) / 1200), s = (t - since) / 1000;   // ease in from where the panels are
    const dx = Math.sin(s * .8), dy = .6 * Math.sin(s * .6 + .5);
    parallax(fx + (dx - fx) * k, fy + (dy - fy) * k);
  };
  const sync = () => { cancelAnimationFrame(raf); raf = inView && !document.hidden ? requestAnimationFrame(drift) : 0; };
  new IntersectionObserver(([e]) => { inView = e.isIntersecting; sync(); }).observe(stage);
  document.addEventListener('visibilitychange', sync);
  stage.addEventListener('touchmove', e => {
    const p = e.touches[0]; lead = performance.now();
    fx = clamp((p.clientX / innerWidth - .5) * 2); fy = clamp((p.clientY / innerHeight - .5) * 2);
    parallax(fx, fy);
  }, { passive: true });
  addEventListener('deviceorientation', e => { if (e.gamma != null) lead = performance.now(); }, { passive: true });
}

/* Language: ?lang= wins, then a remembered choice, then the phone's language, then Arabic.
   Spec: nfc-piece/README.md "Menu language". */
const show = (l, first, remember) => {
  l = (l === 'en') ? 'en' : 'ar';
  for (const k of ['ar', 'en']) { const button = document.getElementById('btn-' + k); button.setAttribute('aria-pressed', k === l); button.hidden = k === l; }
  const more = document.getElementById('more'), card = document.getElementById('card-link');
  more.textContent = MORE[l]; more.href = SITE + 'irbid/?lang=' + l; more.lang = l;
  if (FROM_SITE) { const back = document.getElementById('back'); back.hidden = false; back.textContent = BACK[l]; back.lang = l; back.href = SITE + 'irbid/?lang=' + l; }
  card.textContent = CARD[l]; card.lang = l; if (LOYALTY_URL) { card.href = LOYALTY_URL + '?lang=' + l; document.getElementById('under').hidden = false; }
  document.getElementById('menu-title').textContent = l === 'ar' ? 'منيو' : 'Menu';
  dock.dataset.lang = l;
  stage.setAttribute('aria-label', LABEL[l]);
  document.documentElement.lang = l;
  document.documentElement.dir = (l === 'ar') ? 'rtl' : 'ltr';
  if (remember) { try { localStorage.setItem(KEY, l); } catch (e) {} const u = new URL(location.href); if (u.searchParams.has('lang')) { u.searchParams.set('lang', l); history.replaceState(null, '', u); } }   /* ?lang outranks the saved choice, so it follows the switch: a reload or a copied link keeps the language on screen */
  if (first) { build(l, !still); return; }
  stage.classList.add('swap');
  setTimeout(() => build(l, false).then(() => stage.classList.remove('swap')), 170);
};
for (const k of ['ar', 'en']) document.getElementById('btn-' + k).onclick = () => { armTilt(); if (dock.dataset.lang !== k) show(k, false, true); };
const param = new URLSearchParams(location.search).get('lang');
let saved = null; try { saved = localStorage.getItem(KEY); } catch (e) {}
show(param || saved || (navigator.language.indexOf('ar') === 0 ? 'ar' : 'en'), true, false);
</script>
