    --sw-bg: #0C0708;

<body>
<div id="top"></div>
<div id="world"></div>

<script src="sw.js"></script>
<script>
/* Four scenes, each one their own room re-rendered from their own photograph, emptied of people.
   The camera only ever moves forward: street, inside, across the room, onto the food. */
mountScrollWorld(document.getElementById('world'), {
  brand: { name: 'One For All', href: '../' },
  cta: { label: 'See the menu', href: '../' },
  hint: 'scroll to walk in',
  diveScroll: 1.3,
  connScroll: 0.9,
  sections: [
    {
      id: 'street', label: 'Al-Hosn Road',
      still: 'p/street.webp', clip: 'v/street.mp4', clipMobile: 'v/street-m.mp4',
      accent: '#FF5A4E',
      eyebrow: 'The NST, Al-Hosn Road, Irbid',
      title: 'Look for the lit sign.',
      body: 'Ground floor, on the corner, about 200 m from the Al-Hosn intersection.',
      tags: ['Daily 14:00 – 01:30'],
    },
    {
      id: 'room', label: 'Inside',
      still: 'p/room.webp', clip: 'v/room.mp4', clipMobile: 'v/room-m.mp4',
      accent: '#3E6BFF', scroll: 1.5, linger: 0.35,
      eyebrow: 'Inside',
      title: 'Red tile, blue neon.',
      body: 'One room, one counter, and a ceiling full of lights.',
      tags: [],
    },
    {
      id: 'table', label: 'A table',
      still: 'p/table.webp', clip: 'v/table.mp4', clipMobile: 'v/table-m.mp4',
      accent: '#FFCC49',
      eyebrow: 'Or sit down',
      title: 'Checkered tables, under the awning.',
      body: 'By the windows, looking out at the street you came in from.',
      tags: [],
    },
    {
      id: 'burger', label: 'The OFA',
      still: 'p/burger.webp', clip: 'v/burger.mp4', clipMobile: 'v/burger-m.mp4',
      accent: '#C7201E', scroll: 1.7, linger: 0.45,
      eyebrow: 'The OFA',
      title: 'Smashed, stacked, 1.98.',
      body: 'Patty, cheese, One For All sauce. Prices in Jordanian dinar.',
      tags: [],
      cta: { primary: { label: 'See the whole menu', href: '../' },
             secondary: { label: 'Directions', href: 'https://www.google.com/maps/dir/?api=1&destination=32.507500,35.874622' } },
    },
  ],
  connectors:       ['v/c0.mp4', 'v/c1.mp4', 'v/c2.mp4'],
  /* 720-wide, GOP 4: on a phone the seek cost is frames-from-keyframe, so the tighter
     GOP is what stops a fast flick freezing the clip */
  connectorsMobile: ['v/c0-m.mp4', 'v/c1-m.mp4', 'v/c2-m.mp4'],
});
</script>
</body>
</html>
