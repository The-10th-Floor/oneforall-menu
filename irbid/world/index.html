<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>One For All — find the sign | Irbid</title>
<meta name="description" content="Scroll to find it: the lit sign on Al-Hosn Road, and the burger under it. One For All at The NST, Irbid.">
<link rel="canonical" href="https://the-10th-floor.github.io/oneforall-menu/irbid/world/">
<link rel="icon" href="../../stamp.png">
<meta name="theme-color" content="#0C0708">
<meta property="og:type" content="website">
<meta property="og:title" content="One For All — find the sign">
<meta property="og:description" content="The lit sign on Al-Hosn Road, and the burger under it.">
<meta property="og:url" content="https://the-10th-floor.github.io/oneforall-menu/irbid/world/">
<meta property="og:image" content="https://the-10th-floor.github.io/oneforall-menu/irbid/n-street.jpg">
<meta property="og:image:width" content="1000">
<meta property="og:image:height" content="747">
<meta property="og:image:alt" content="One For All's lit sign on their red wall under the NST, Al-Hosn Road, at dusk">
<style>
  /* the night the menu page is set in, so the two read as one place */
  :root, .sw-root {
    --sw-bg: #0C0708;
    --sw-ink: #FFF6EE;
    --sw-ink-soft: #C79A8C;
    --sw-accent: #FF5A4E;
    --sw-font-display: "Archivo", "Arial Black", system-ui, sans-serif;
    --sw-font-body: "Baloo Bhaijaan 2", system-ui, sans-serif;
  }
  html, body { margin: 0; background: #0C0708; }
  /* Their mark, not the engine's placeholder square: the same badge file the menu page flies into
     its bar, so a visitor arriving from the menu already has it cached. #world is here because the
     engine injects its own sheet after this one and would win on equal specificity. */
  #world .sw-brand__mark {
    width: 30px; height: 36px; border-radius: 0; box-shadow: none;
    background: url(../../ofa-badge.webp) center / contain no-repeat;
    filter: drop-shadow(0 0 14px rgba(255,150,110,.4)) drop-shadow(0 6px 12px rgba(0,0,0,.7));
  }
  /* on a phone the scroll hint sat against the last row of the caption's pills */
  @media (max-width: 860px) {
    #world .sw-copy { bottom: calc(clamp(104px, 16dvh, 140px) + env(safe-area-inset-bottom)); }
  }
  /* Arabic. Archivo has no Arabic, so the display face is the body's; and letter-spacing, which
     the engine uses on its small capitals, pulls joined Arabic letters apart, so it goes. */
  html[dir=rtl], html[dir=rtl] .sw-root { --sw-font-display: "Baloo Bhaijaan 2", system-ui, sans-serif; }
  html[dir=rtl] #world * { letter-spacing: 0 !important; }
  /* "01 / 02" is numbers and a slash, which a right-to-left line reorders into "02 / 01" - scene 2
     of 1. A count reads left to right in every language. */
  #world .sw-copy__num { direction: ltr; unicode-bidi: isolate; display: inline-block; }
  /* with no script there is no film: their street, the two things you came for, and the way back */
  .nojs { box-sizing: border-box; min-height: 100dvh; display: grid; align-content: end; gap: 14px; padding: 24px 18px 34px;
    color: #FFF6EE; font: 500 16px/1.55 "Baloo Bhaijaan 2", system-ui, sans-serif;
    background: linear-gradient(0deg, #0C0708 22%, rgba(12,7,8,.2) 70%), url(p/street.webp) center / cover no-repeat; }
  .nojs p { margin: 0; max-width: 34em; }
  .nojs a { display: inline-flex; align-items: center; min-height: 48px; padding: 0 18px; margin: 4px 8px 0 0;
    border-radius: 13px; background: #FFF6EE; color: #0C0708; font-weight: 800; text-decoration: none; }
</style>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Archivo:wdth,wght@112,900&display=swap" rel="stylesheet">
</head>
<body>
<div id="top"></div>
<div id="world"></div>
<noscript>
  <div class="nojs">
    <p lang="en">One For All is on the ground floor of The NST, on the corner, about 200 m from the Al-Hosn intersection. Daily 14:00 – 01:30. Takeaway.</p>
    <p lang="ar" dir="rtl">ون فور اول في The NST، طريق الحصن، على بعد 200 م تقريباً من إشارة الحصن. يومياً 14:00 – 01:30. سفري.</p>
    <p>
      <a href="../">Menu · المنيو</a>
      <a href="https://www.google.com/maps/dir/?api=1&destination=32.507500,35.874622">Directions · الاتجاهات</a>
    </p>
  </div>
</noscript>

<script src="sw.js"></script>
<script>
/* Two scenes, both true of THIS branch: the shopfront, and the burger. Irbid is a counter - no
   room to sit in - so the interior scenes that were here are in the vault, for the branches that
   have one. Both stills are re-rendered from their own photographs and hold no people. */

/* The Arabic menu's "كيف توصل" link used to land an Arabic reader in an English-only film with no way
   to switch. The language arrives the same way it does on the menu page - ?lang, then the choice the
   visitor saved there (same origin, same key) - and the way back carries it. Wherever the menu page
   already has the words, these are the menu page's words, not a second translation. */
const MAPS = 'https://www.google.com/maps/dir/?api=1&destination=32.507500,35.874622';
let lang = new URLSearchParams(location.search).get('lang');
try { lang = lang || localStorage.getItem('ofa-lang'); } catch (e) {}
lang = lang === 'ar' ? 'ar' : 'en';
document.documentElement.lang = lang;
document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
const BACK = '../?lang=' + lang;

const T = {
  en: {
    title: 'One For All — find the sign | Irbid',
    cta: 'See the menu', hint: 'scroll',
    street: { label: 'Al-Hosn Road', eyebrow: 'The NST, Al-Hosn Road, Irbid', title: 'Look for the lit sign.',
              body: 'Ground floor, on the corner, about 200 m from the Al-Hosn intersection.',
              tags: ['Daily 14:00 – 01:30', 'Takeaway'] },
    burger: { label: 'The OFA', eyebrow: 'The OFA', title: 'Smashed, stacked, 1.98.',
              body: 'Patty, cheese, One For All sauce. Prices in Jordanian dinar.',
              primary: 'See the whole menu', secondary: 'Directions' },
  },
  ar: {
    title: 'ون فور اول — دوّر عاللوحة | إربد',
    cta: 'شوف المنيو', hint: 'مرّر',
    street: { label: 'طريق الحصن', eyebrow: 'The NST، طريق الحصن، إربد', title: 'دوّر عاللوحة المضوية.',
              body: 'الطابق الأرضي، عالزاوية. طريق الحصن، على بعد 200 م تقريباً من إشارة الحصن.',
              tags: ['يومياً 14:00 – 01:30', 'سفري'] },
    burger: { label: 'الـOFA', eyebrow: 'الـOFA', title: 'سماشد برجر بـ 1.98',
              body: 'برجر، صوص ون فور اول، جبنة. الأسعار بالدينار الأردني.',
              primary: 'المنيو كامل', secondary: 'الاتجاهات' },
  },
}[lang];
document.title = T.title;

mountScrollWorld(document.getElementById('world'), {
  brand: { name: 'One For All', href: BACK },
  cta: { label: T.cta, href: BACK },
  hint: T.hint,
  diveScroll: 1.3,
  connScroll: 0.9,
  sections: [
    {
      id: 'street', label: T.street.label,
      still: 'p/street.webp', clip: 'v/street.mp4', clipMobile: 'v/street-m.mp4',
      accent: '#FF5A4E',
      eyebrow: T.street.eyebrow, title: T.street.title, body: T.street.body, tags: T.street.tags,
    },
    {
      id: 'burger', label: T.burger.label,
      still: 'p/burger.webp', clip: 'v/burger.mp4', clipMobile: 'v/burger-m.mp4',
      accent: '#C7201E', scroll: 1.7, linger: 0.45,
      eyebrow: T.burger.eyebrow, title: T.burger.title, body: T.burger.body,
      tags: [],
      cta: { primary: { label: T.burger.primary, href: BACK },
             secondary: { label: T.burger.secondary, href: MAPS } },
    },
  ],
  /* null, not a clip: the two scenes are a shopfront and a studio still life, so the engine
     crossfades the seam. A camera flying from a street into a red void would be worse, and
     this costs nothing. */
  connectors: [null],
});
</script>
</body>
</html>
